skill: skill-demo
version: "1.0.0"
cases:
  - id: summary-basic
    input: 分析 report.pdf
    expect:
      - 输出包含 "# 文档摘要："
      - 输出包含 "## 核心内容"
  - id: missing-file
    input: 分析 not-exist.pdf
    expect:
      - 脚本以非零退出码结束
      - 输出包含 "错误：文件不存在"
  - id: wrong-extension
    input: 分析 notes.txt
    expect:
      - 脚本以非零退出码结束
      - 输出包含 "错误：文件类型不支持"